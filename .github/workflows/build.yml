# Checks discommand. Runs without keys/keys.env, so it never needs (or sees)
# the publisher's app IDs.
#
# - Every push to master and every pull request: one quick Linux job (tests,
#   each integration on its own, the WhatsApp helper). Changes to docs only
#   don't start it.
# - Releases (tags v*) and manual runs ("Run workflow" on the Actions tab):
#   optimised builds on all six platforms.
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore: ["**.md", "keys/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "keys/**", "LICENSE"]
  release:
    types: [published]
  workflow_dispatch:

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Reuses compiled dependencies between runs: minutes instead of a quarter hour.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: wa/go.mod
          cache-dependency-path: wa/go.sum

      - name: Test (Rust, all integrations)
        run: cargo test
      - name: Each integration on its own
        run: |
          for f in discord whatsapp matrix calendar todo twos moodle; do
            echo "::group::$f"
            cargo check --no-default-features --features native-tls,$f
            echo "::endgroup::"
          done
      - name: Test (Go)
        working-directory: wa
        run: go test ./...

  build:
    # Only for releases and manual runs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Windows ARM64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, goarch: amd64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: wa/go.mod
          cache-dependency-path: wa/go.sum

      - name: Build (Rust)
        shell: bash
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Build (Go)
        working-directory: wa
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o discommand-wa .
