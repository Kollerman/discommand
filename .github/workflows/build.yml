# Checks and builds discommand on every push and pull request (the repo is
# public, so GitHub's runners cost nothing). Runs without keys/keys.env, so it
# never needs (or sees) the publisher's app IDs.
#
# - test: the tests on all six platforms (Go's too).
# - features: each integration and option built on its own (Linux).
# - build: optimised builds on all six platforms, downloadable from the run's
#   page (Artifacts) for two weeks.
# Changes to docs only don't start it.
name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    paths-ignore: ["**.md", "keys/**", "LICENSE", "assets/logo.svg"]
  pull_request:
    paths-ignore: ["**.md", "keys/**", "LICENSE", "assets/logo.svg"]
  release:
    types: [published]
  workflow_dispatch:

# A newer push cancels the run still going for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every option except transcription: its matrix code (gemm) only compiles
  # optimised on ARM Linux and Windows, so their debug tests leave it out.
  NO_WHISPER: native-tls,discord,whatsapp,matrix,calendar,todo,twos,moodle,groupwise,sound,pdf,totp

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Windows ARM64, os: windows-11-arm, no_whisper: true }
          - { name: Linux x64, os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm, no_whisper: true }
          - { name: macOS Apple Silicon, os: macos-latest }
          # Built for Intel on the Apple Silicon runner: checked, not run.
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, check_only: true }
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Reuses compiled dependencies between runs: minutes instead of a quarter hour.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: wa/go.mod
          cache-dependency-path: wa/go.sum
      # Sound plays through ALSA on Linux, which needs its headers to build.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Test (Rust)
        if: ${{ !matrix.check_only }}
        shell: bash
        run: |
          if [ "${{ matrix.no_whisper }}" = true ]; then
            cargo test --no-default-features --features "$NO_WHISPER"
          else
            cargo test
          fi
      - name: Check (Rust)
        if: ${{ matrix.check_only }}
        run: cargo check --all-targets --target ${{ matrix.target }}
      - name: Test (Go)
        if: ${{ !matrix.check_only }}
        working-directory: wa
        run: go test ./...

  features:
    name: Each integration on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Check
        run: |
          for f in discord whatsapp matrix calendar todo twos moodle groupwise; do
            echo "::group::$f"
            cargo check --no-default-features --features native-tls,$f
            echo "::endgroup::"
          done
          # The options aren't integrations: each with one integration.
          for f in transcribe sound pdf totp; do
            echo "::group::discord + $f"
            cargo check --no-default-features --features native-tls,discord,$f
            echo "::endgroup::"
          done
          # Pure-Rust TLS (Termux, static Linux builds).
          echo "::group::rustls"
          cargo check --no-default-features --features rustls,discord,whatsapp,calendar
          echo "::endgroup::"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, file: windows-x64 }
          - { name: Windows ARM64, os: windows-11-arm, file: windows-arm64 }
          - { name: Linux x64, os: ubuntu-latest, file: linux-x64 }
          - { name: Linux ARM64, os: ubuntu-24.04-arm, file: linux-arm64 }
          - { name: macOS Apple Silicon, os: macos-latest, file: macos-arm64 }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, goarch: amd64, file: macos-x64 }
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: wa/go.mod
          cache-dependency-path: wa/go.sum
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build (Rust)
        shell: bash
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Build (Go)
        shell: bash
        working-directory: wa
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "discommand-wa$(go env GOEXE)" .
      - name: Collect
        shell: bash
        run: |
          mkdir out
          dir=target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release
          cp "$dir"/discommand* out/ 2>/dev/null || true
          rm -f out/*.d out/*.pdb
          cp wa/discommand-wa* out/
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: discommand-${{ matrix.file }}
          path: out/
          retention-days: 14
