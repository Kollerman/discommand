[package]
name = "discommand"
version = "0.1.2"
edition = "2024"
description = "Lightweight, battery-friendly terminal Discord client"
license = "MIT"

[features]
default = ["native-tls", "discord", "whatsapp", "matrix", "calendar", "todo", "twos", "moodle"]

# Integrations: build with any subset, e.g.
#   cargo build --release --no-default-features --features native-tls,discord,calendar
# (the install scripts take --with / -With for this). Each one is a Shift+Tab tab.
discord = ["dep:rsa"]
whatsapp = []
# Matrix with end-to-end encryption (matrix-rust-sdk). Its HTTP client always uses
# rustls; ring is its crypto backend (builds everywhere, unlike aws-lc).
matrix = ["dep:matrix-sdk", "dep:rustls", "dep:mime"]
calendar = []
todo = []
twos = []
# Any Moodle site: courses, their contents and deadlines.
moodle = []

# OS TLS stack: SChannel on Windows, Security.framework on macOS, OpenSSL on Linux.
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
# Pure-Rust TLS (handy for Termux / static Linux builds without OpenSSL headers).
rustls = ["reqwest/rustls-tls-webpki-roots", "tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
# Cookies: Moodle sites without the app interface are used like a browser.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
dirs = "5"
rpassword = "7"
qrcode = { version = "0.14", default-features = false }
# Pure-Rust decoders only: no C toolchain needed on ARM.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Google sign-in (PKCE) and Discord's QR-code login.
sha2 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "getrandom"], optional = true }
getrandom = "0.4"

# Matrix: sessions, room state and encryption keys in an encrypted SQLite store
# (SQLite is compiled in, so no system library is needed).
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# The type of a file sent to Matrix.
mime = { version = "0.3", optional = true }

# The system's file dialog (picking files to send); Linux uses the desktop's
# portal, so no GTK is needed to build.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# DPAPI token encryption, EFS folder encryption, and telling left from right Shift.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Logins are kept in the login Keychain.
security-framework = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
