[package]
name = "discommand"
version = "0.3.0"
edition = "2024"
description = "Lightweight, battery-friendly terminal Discord client"
license = "MIT"

[features]
default = ["native-tls", "discord", "whatsapp", "matrix", "calendar", "todo", "twos", "moodle", "transcribe", "sound", "pdf", "totp", "groupwise"]

# Integrations: build with any subset, e.g.
#   cargo build --release --no-default-features --features native-tls,discord,calendar
# (the install scripts take --with / -With for this). Each one is a Shift+Tab tab.
discord = ["dep:rsa"]
whatsapp = []
# Matrix with end-to-end encryption (matrix-rust-sdk). Its HTTP client always uses
# rustls; ring is its crypto backend (builds everywhere, unlike aws-lc).
matrix = ["dep:matrix-sdk", "dep:rustls", "dep:mime"]
calendar = []
todo = []
twos = []
# Any Moodle site: courses, their contents and deadlines.
moodle = []
# Voice messages to text (t), on this computer: Whisper "small", run with candle
# (pure Rust). The 259 MB model is downloaded on first use.
transcribe = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:ogg", "dep:opus-decoder"]
# Sound: voice messages played (p), with a retro crunch, and an alert for new
# messages while the window isn't focused. Linux needs the ALSA headers (libasound2-dev).
# PDFs shown in the app: pages as pictures (Sixel or Kitty, where the terminal can) and
# their text, searchable, everywhere. hayro reads them (pure Rust).
pdf = ["dep:hayro", "dep:ratatui-image"]
# An authenticator app: the 6-digit codes of logins with a second factor (TOTP), shown
# with :totp. No tab of its own.
totp = ["dep:hmac", "dep:sha1"]
# GroupWise at the University of Regensburg: so far the login (university login,
# Microsoft's second factor), tried with --groupwise-login.
groupwise = []
sound = ["dep:rodio", "dep:ogg", "dep:opus-decoder"]

# OS TLS stack: SChannel on Windows, Security.framework on macOS, OpenSSL on Linux.
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
# Pure-Rust TLS (handy for Termux / static Linux builds without OpenSSL headers).
rustls = ["reqwest/rustls-tls-webpki-roots", "tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
# Cookies: Moodle sites without the app interface are used like a browser.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
dirs = "5"
rpassword = "7"
qrcode = { version = "0.14", default-features = false }
# Pure-Rust decoders only: no C toolchain needed on ARM.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Google sign-in (PKCE) and Discord's QR-code login.
sha2 = "0.10"
# The authenticator codes (TOTP).
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
rsa = { version = "0.9", default-features = false, features = ["std", "getrandom"], optional = true }
getrandom = "0.4"

# Matrix: sessions, room state and encryption keys in an encrypted SQLite store
# (SQLite is compiled in, so no system library is needed).
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
# The type of a file sent to Matrix.
mime = { version = "0.3", optional = true }

# Transcription: the model (CPU only); and for it and sound, a pure-Rust Opus decoder
# for voice messages.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
ogg = { version = "0.9", optional = true }
opus-decoder = { version = "0.1", optional = true }
# PDFs: hayro draws and reads them; ratatui-image puts the pictures on screen (8.x is
# the last for ratatui 0.29).
hayro = { version = "0.8", optional = true }
ratatui-image = { version = "=8.0.1", default-features = false, features = ["crossterm"], optional = true }
# Sound: playback, and mp3 for the startup sound (the voice messages are decoded above).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"], optional = true }

# The system's file dialog (picking files to send); Linux uses the desktop's
# portal, so no GTK is needed to build.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# DPAPI token encryption, EFS folder encryption, and telling left from right Shift.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Logins are kept in the login Keychain.
security-framework = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
